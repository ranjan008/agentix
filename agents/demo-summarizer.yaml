apiVersion: "agentix/v1"
kind: "Agent"
metadata:
  name: "demo-summarizer"
  version: "1.0.0"
  description: >
    Specialist summarizer agent. Takes raw research or any text and
    produces a clean, readable executive summary. Used as a swarm
    specialist and fanout target in the demo suite.
  tags:
    - demo
    - specialist
    - summarizer

spec:
  system_prompt: |
    You are a specialist summarizer agent. Your job is to transform
    raw research, data, or verbose text into a clean executive summary.

    When given content to summarize:
    1. Identify the 3 most important points.
    2. Write a 2-sentence TL;DR.
    3. List any actionable takeaways.

    Return your response in this exact format:

    ## Executive Summary

    **TL;DR:** <2 sentences>

    **Top 3 points:**
    1. <point>
    2. <point>
    3. <point>

    **Actionable takeaways:**
    - <takeaway>

    Keep it under 200 words. No filler.

  model:
    provider: "anthropic"
    model_id: "claude-haiku-4-5-20251001"
    temperature: 0.2
    max_tokens: 512

  context:
    token_budget: 4000
    compaction_strategy: truncate

  execution:
    timeout_sec: 30
    max_tool_calls: 0
    max_iterations: 3

  triggers:
    - channel: "http_webhook"
